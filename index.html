  <!-- Color Scheme and Theme Color -->
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#F5F7FB" id="theme-color-meta" />

  <!-- Inline Script to set data-theme before first paint (no flash of wrong theme) -->
  <script>
    (function() {
      try {
        var saved = localStorage.getItem('theme');
        var theme = (saved === 'dark' || saved === 'light') ? saved : 'light';
        document.documentElement.dataset.theme = theme;
        var meta = document.getElementById('theme-color-meta');
        if (meta) {
          meta.setAttribute('content', theme === 'dark' ? '#0B101E' : '#F4F6FA');
        }
      } catch (e) {}
    })();
  </script>
